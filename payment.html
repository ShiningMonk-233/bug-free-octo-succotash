<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Payment</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #fafafa; text-align: center; padding: 20px; }
        .payment-box { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; }
        .amount-display { font-size: 24px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .upi-apps { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .app-btn { padding: 12px; text-decoration: none; color: #333; border: 1px solid #ddd; border-radius: 8px; font-weight: bold; }
        .copy-box { margin-top: 20px; padding: 10px; background: #f4f4f4; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .copy-btn { background: #28a745; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="payment-box">
        <h2>Scan to Pay</h2>
        <div class="amount-display" id="displayAmount">₹0.00</div>
        
        <div id="qrcode"></div>

        <div class="upi-apps">
            <a href="#" id="paytmBtn" class="app-btn">Pay via Paytm</a>
            <a href="#" id="gpayBtn" class="app-btn">Pay via GPay</a>
            <a href="#" id="phonepeBtn" class="app-btn">Pay via PhonePe</a>
        </div>

        <div class="copy-box">
            <span id="displayUpi">upi@id</span>
            <button class="copy-btn" onclick="copyUPI()">Copy</button>
        </div>
    </div>

    <script>
        // 1. Get data from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const upi = urlParams.get('upi');
        const name = urlParams.get('name');
        const amount = urlParams.get('amount');

        // 2. Format the standard UPI string
        const upiString = `upi://pay?pa=${upi}&pn=${name}&am=${amount}&cu=INR`;

        // 3. Update the HTML text
        document.getElementById('displayAmount').innerText = `₹${amount}`;
        document.getElementById('displayUpi').innerText = upi;

        // 4. Generate the QR Code
        new QRCode(document.getElementById("qrcode"), {
            text: upiString,
            width: 200,
            height: 200,
        });

        // 5. Set up Mobile App deep links
        document.getElementById('paytmBtn').href = `paytmmp://pay?pa=${upi}&pn=${name}&am=${amount}&cu=INR`;
        document.getElementById('gpayBtn').href = `tez://upi/pay?pa=${upi}&pn=${name}&am=${amount}&cu=INR`;
        document.getElementById('phonepeBtn').href = `phonepe://pay?pa=${upi}&pn=${name}&am=${amount}&cu=INR`;

        // 6. Copy functionality
        function copyUPI() {
            navigator.clipboard.writeText(upi);
            alert("UPI ID Copied!");
        }
    </script>
</body>
</html>
