<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Login — Receipt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --page: #F1EFE6;
    --paper: #FCFBF6;
    --ink: #201F1C;
    --ink-soft: #6B675D;
    --hairline: #D9D3C3;
    --green: #1F4B3F;
    --green-soft: #E8EEE9;
    --stamp: #A6392B;
    --shadow: rgba(32, 31, 28, 0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--page); color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}

  .stub{width:100%; max-width:360px;}
  .brand{text-align:center; margin-bottom:18px;}
  .brand .mark{font-size:13px; letter-spacing:0.3px; color:var(--ink-soft);}
  .brand h1{font-size:20px; margin:2px 0 0; font-weight:600;}

  .card{
    background:var(--paper); border:1px solid var(--hairline); border-radius:4px;
    box-shadow:0 10px 30px var(--shadow); overflow:hidden;
  }
  .perf{
    height:14px;
    background-image: radial-gradient(circle at 7px 7px, var(--page) 7px, transparent 7.5px);
    background-size: 20px 14px; background-repeat: repeat-x; margin-top:-1px;
  }
  .card-body{padding:26px 26px 24px;}
  .card p.hint{margin:0 0 20px; font-size:13px; color:var(--ink-soft);}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px;}
  .field input{
    width:100%; border:none; border-bottom:1.5px solid var(--hairline);
    background:transparent; font-size:15px; padding:8px 2px;
    font-family:'IBM Plex Sans', sans-serif; color:var(--ink);
  }
  .field input:focus{outline:none; border-bottom-color:var(--green);}

  button.primary{
    width:100%; padding:13px 16px; background:var(--green); color:#fff;
    border:none; border-radius:3px; font-size:14.5px; font-weight:600;
    font-family:'IBM Plex Sans', sans-serif; cursor:pointer; margin-top:8px;
  }
  button.primary:hover{background:#173a31;}
  button.primary:disabled{background:#A9B4AE; cursor:not-allowed;}

  .error{
    display:none; margin-top:16px; padding:10px 12px; border-radius:3px;
    background:#F6E7E4; color:var(--stamp); font-size:13px;
  }
  .note-line{
    font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:16px; line-height:1.5;
  }
</style>
</head>
<body>
  <div class="stub">
    <div class="brand">
      <div class="mark mono">RECEIPT</div>
      <h1>Seller login</h1>
    </div>
    <div class="card">
      <div class="perf"></div>
      <div class="card-body">
        <p class="hint">Log in to open your dashboard and send payment requests.</p>

        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" autocomplete="username" placeholder="e.g. meera">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
        </div>

        <button class="primary" id="loginBtn">Log in</button>
        <div id="error-message" class="error">That username or password isn't right. Try again.</div>
        <div class="note-line">This is a prototype login for demoing the flow — swap it for real, server-checked accounts before you take real payments through it.</div>
      </div>
    </div>
  </div>

<script>
  // Prototype credentials — replace with real server-side auth.
  const VALID_USER = "admin";
  const VALID_PASS = "password123";

  const userEl = document.getElementById('username');
  const passEl = document.getElementById('password');
  const errEl = document.getElementById('error-message');
  const btn = document.getElementById('loginBtn');

  function attemptLogin(){
    const user = userEl.value.trim();
    const pass = passEl.value;

    if(user !== VALID_USER || pass !== VALID_PASS){
      errEl.style.display = "block";
      return;
    }
    errEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Logging in…";

    try {
      localStorage.setItem('session-authed', 'true');
    } catch(e) { /* non-fatal */ }

    window.location.href = "dashboard.html";
  }

  btn.addEventListener('click', attemptLogin);
  passEl.addEventListener('keydown', e => { if(e.key === 'Enter') attemptLogin(); });
</script>
</body>
</html>
